# R1 (PE1, NE40E)
system-view
sysname R1

vlan 100
 description GERENCIA_OLT
quit

interface LoopBack0
 description ROUTER_ID_R1
 ip address 10.200.255.1 255.255.255.255
quit

interface Eth-Trunk 1
 portswitch
 description LINK_PARA_CE12800_OLT
 mode lacp-static
 port link-type trunk
 port trunk allow-pass vlan 100
quit

interface Ethernet1/0/0
 undo shutdown
 eth-trunk 1
quit

interface Ethernet1/0/1
 undo shutdown
 eth-trunk 1
quit

interface Vlanif 100
 ip address 10.200.0.2 255.255.255.252
quit

interface Ethernet1/0/2
 description LINK_PARA_R2
 ip address 10.200.0.5 255.255.255.252
 undo shutdown
quit

# Gerência fora de banda
interface GigabitEthernet0/0/0
 description GERENCIA_FORA_DE_BANDA
 ip address 192.168.100.1 255.255.255.0
 undo shutdown
quit

commit
