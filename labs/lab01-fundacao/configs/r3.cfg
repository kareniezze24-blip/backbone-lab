# R3 (PE2, NE40E)
system-view
sysname R3

interface LoopBack0
 description ROUTER_ID_R3
 ip address 10.200.255.3 255.255.255.255
quit

interface Ethernet1/0/0
 description LINK_PARA_R2
 ip address 10.200.0.10 255.255.255.252
 undo shutdown
quit

# Gerência fora de banda
interface GigabitEthernet0/0/0
 description GERENCIA_FORA_DE_BANDA
 ip address 192.168.100.3 255.255.255.0
 undo shutdown
quit

commit
