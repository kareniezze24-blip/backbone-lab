# CE12800 (faz papel de OLT)
system-view
sysname CE12800

vlan 100
 description GERENCIA_OLT
quit

interface Eth-Trunk 1
 description LINK_PARA_R1
 mode lacp-static
 port link-type trunk
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 100
quit

interface GE1/0/0
 undo shutdown
 eth-trunk 1
quit

interface GE1/0/1
 undo shutdown
 eth-trunk 1
quit

interface Vlanif 100
 ip address 10.200.0.1 255.255.255.252
quit

# Gerência fora de banda
interface MEth0/0/0
 description GERENCIA_FORA_DE_BANDA
 ip address 192.168.100.10 255.255.255.0
quit
