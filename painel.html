<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de progresso</title>
<link rel="stylesheet" href="assets/app.css">
<script>
(function(){var t=null;try{t=localStorage.getItem('bl_theme')}catch(e){}
if(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';
document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();
</script>
</head>
<body>
<header class="top"><a href="./">&larr; Voltar ao site</a><span class="title">Painel de progresso</span><button class="btn" id="themeBtn" type="button">Tema</button></header>
<main class="wrap" id="app"></main>
<script>
document.getElementById('themeBtn').onclick=function(){var c=document.documentElement.getAttribute('data-theme');var n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('bl_theme',n)}catch(e){}};
function h(tag,attrs){var e=document.createElement(tag);attrs=attrs||{};for(var k in attrs){if(k==='class')e.className=attrs[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}
for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;if(Array.isArray(c)){c.forEach(function(x){if(x!=null)e.append(x.nodeType?x:document.createTextNode(String(x)))});}else e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return {}}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var LABS=[{"folder": "lab01-fundacao", "titulo": "Lab 01: Fundação (Eth-Trunk, IPs de link, Loopback e gerência)"}, {"folder": "lab01-5-vlan-mac", "titulo": "Lab 1.5: VLAN, trunk, access e tabela MAC"}, {"folder": "lab01-6-stp", "titulo": "Lab 1.6: STP/RSTP e loops de camada 2"}, {"folder": "lab02-rotas-estaticas", "titulo": "Lab 2: Rotas estáticas fim a fim"}, {"folder": "lab03-ospf", "titulo": "Lab 3: OSPF no backbone"}, {"folder": "lab04-isis", "titulo": "Lab 4: IS-IS no backbone"}, {"folder": "lab05-mpls-ldp", "titulo": "Lab 5: MPLS e LDP"}, {"folder": "lab05-1-mpls-te", "titulo": "Lab 5.1: MPLS-TE, túneis e proteção"}, {"folder": "lab05-2-ldp-remoto-bfd-frr", "titulo": "Lab 5.2: LDP remoto, BFD e FRR"}, {"folder": "lab06-l2vpn", "titulo": "Lab 6: L2VPN (pseudowire e VPLS)"}, {"folder": "lab06-1-l3vpn", "titulo": "Lab 6.1: L3VPN (VRF, RD/RT e MP-BGP)"}, {"folder": "lab07-olt-acesso", "titulo": "Lab 7: OLT e rede de acesso"}, {"folder": "lab08-seguranca", "titulo": "Lab 8: Segurança de gerência e acesso"}, {"folder": "lab09-monitoramento", "titulo": "Lab 9: Monitoramento, horário e backup"}, {"folder": "lab10-simulado", "titulo": "Lab 10: Simulado de troubleshooting"}];
var TOPICS=[{"slug": "01-fundamentos-e-enderecamento", "titulo": "Fundamentos e endereçamento IP", "n": 16}, {"slug": "02-camada-2", "titulo": "Camada 2: VLAN, trunk, STP e LACP", "n": 14}, {"slug": "03-roteamento", "titulo": "Roteamento: estático, OSPF, IS-IS e BGP", "n": 14}, {"slug": "04-mpls", "titulo": "MPLS, LDP e engenharia de tráfego", "n": 12}, {"slug": "05-servicos-vpn", "titulo": "Serviços: L2VPN e L3VPN", "n": 10}, {"slug": "06-acesso-olt-pon", "titulo": "Rede de acesso: OLT, PON e serviços", "n": 11}, {"slug": "07-seguranca-e-monitoramento", "titulo": "Segurança, gerência e monitoramento", "n": 11}, {"slug": "08-troubleshooting-cenarios", "titulo": "Cenários de troubleshooting", "n": 10}];
var app=document.getElementById('app');
var STEPS=['Montado','Falha testada','Erros provocados'];
function render(){
  app.innerHTML='';
  var prog=lsGet('bl_progress');var quiz=lsGet('bl_quiz');
  var total=LABS.length*STEPS.length,done=0;
  LABS.forEach(function(L){(prog[L.folder]||[]).forEach(function(v){if(v)done++})});
  var pct=Math.round(done/total*100);
  app.append(h('h1',null,'Painel de progresso'),
    h('p',{class:'muted'},'Marque o que já fez. Os dados ficam salvos neste navegador (não vão para o GitHub).'),
    h('div',{class:'card'},h('h3',null,'Labs: '+pct+'% concluído'),h('div',{class:'bar'},h('i',{style:'width:'+pct+'%'})),h('span',{class:'muted'},done+' de '+total+' etapas')));
  var t=h('table');
  t.append(h('tr',null,h('th',null,'Lab'),STEPS.map(function(s){return h('th',null,s)})));
  LABS.forEach(function(L){
    var cur=prog[L.folder]||[false,false,false];
    var row=h('tr',null,h('td',null,h('a',{href:'./#/labs/'+L.folder+'/README'},L.titulo)));
    STEPS.forEach(function(s,i){
      var c=h('input',{type:'checkbox'});c.checked=!!cur[i];
      c.onchange=function(){var p=lsGet('bl_progress');var a=p[L.folder]||[false,false,false];a[i]=c.checked;p[L.folder]=a;lsSet('bl_progress',p);render();};
      row.append(h('td',null,c));
    });
    t.append(row);
  });
  app.append(h('h2',null,'Labs'),t);
  var t2=h('table');
  t2.append(h('tr',null,h('th',null,'Tema do quiz'),h('th',null,'Último resultado'),h('th',null,'Data')));
  var sum=0,cnt=0;
  TOPICS.forEach(function(tp){var r=quiz[tp.slug];if(r){sum+=r.pct;cnt++;}
    t2.append(h('tr',null,h('td',null,tp.titulo),h('td',null,r?r.pct+'% ('+r.correct+'/'+r.total+')':'não feito'),h('td',null,r?r.date:'')));});
  var sim=quiz['simulado'];
  t2.append(h('tr',null,h('td',null,'Simulado geral'),h('td',null,sim?sim.pct+'% ('+sim.correct+'/'+sim.total+')':'não feito'),h('td',null,sim?sim.date:'')));
  app.append(h('h2',null,'Exercícios'),cnt?h('p',null,'Média dos temas feitos: '+Math.round(sum/cnt)+'%'):null,t2,
    h('div',{class:'row'},h('a',{class:'btn primary',href:'quiz.html'},'Ir para o quiz'),
    h('button',{class:'btn',type:'button',onclick:function(){if(confirm('Apagar todo o progresso salvo neste navegador?')){try{localStorage.removeItem('bl_progress');localStorage.removeItem('bl_quiz')}catch(e){}render();}}},'Zerar progresso')));
}
render();
</script>
</body>
</html>
