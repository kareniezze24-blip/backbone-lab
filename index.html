<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backbone Lab</title>
<meta name="description" content="Estudo de redes de operadora: conceitos, laboratórios e exercícios interativos">
<link rel="stylesheet" href="assets/app.css">
<script>
(function () {
  var t = null; try { t = localStorage.getItem('bl_theme'); } catch (e) {}
  if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
})();
</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">Backbone <span>Lab</span></a>
  <nav class="tabs">
    <a data-tab="home" href="#/">Início</a>
    <a data-tab="conceitos" href="#/conceitos">Conceitos</a>
    <a data-tab="labs" href="#/labs">Laboratórios</a>
    <a data-tab="exercicios" href="#/exercicios">Exercícios</a>
  </nav>
  <div class="tools">
    <input id="search" type="search" placeholder="Buscar no conteúdo..." aria-label="Buscar">
    <button class="iconbtn" id="theme" type="button">Tema</button>
  </div>
</header>
<div id="results" class="hidden"></div>
<div id="app"><div class="main"><p class="muted">Carregando...</p></div></div>
<script src="assets/markdown-it.min.js"></script>
<script src="assets/mermaid.min.js"></script>
<script src="assets/topology.js"></script>
<script src="assets/core.js"></script>
<script src="assets/labs.js"></script>
<script src="assets/exercises.js"></script>
<script>BL.start();</script>
</body>
</html>
