, onde ele é tratado. O IP da OLT existe só para gerência.", "exp": ""}, {"t": "d", "q": "Cenário: a gerência da OLT funciona, mas os clientes ficaram sem serviço de internet. O uplink está ativo. Qual a hipótese principal?", "ans": "A VLAN do serviço de internet não está liberada no uplink (ou no transporte L2VPN) em alguma ponta.", "exp": "Gerência e serviço usam VLANs diferentes; uma pode passar e a outra não."}, {"t": "d", "q": "Diferença entre os modelos de VLAN N:1 e 1:1 na OLT.", "ans": "No N:1 todos os clientes de um serviço compartilham a mesma VLAN. No 1:1 cada cliente tem a sua VLAN própria.", "exp": ""}]}, {"slug": "07-seguranca-e-monitoramento", "titulo": "Segurança, gerência e monitoramento", "intro": "Portas, protocolos e boas práticas de operação.", "qs": [{"t": "mc", "q": "Qual a porta do SSH e a do Telnet?", "opts": ["22 e 23", "23 e 22", "80 e 443", "21 e 25"], "ans": 0, "exp": "SSH usa 22 e Telnet usa 23."}, {"t": "mc", "q": "RADIUS e TACACS+ usam, respectivamente:", "opts": ["UDP 1812/1813 e TCP 49", "TCP 49 e UDP 1812", "UDP 161 e TCP 22", "TCP 1812 e UDP 49"], "ans": 0, "exp": "RADIUS usa UDP 1812 e 1813; TACACS+ usa TCP 49."}, {"t": "mc", "q": "SNMP: portas de consulta e de trap?", "opts": ["161 e 162 (UDP)", "162 e 161", "514 e 123", "69 e 67"], "ans": 0, "exp": "Consulta em 161 e traps em 162."}, {"t": "mc", "q": "Qual a porta do syslog?", "opts": ["UDP 514", "TCP 22", "UDP 123", "UDP 161"], "ans": 0, "exp": "Syslog usa UDP 514 por padrão."}, {"t": "mc", "q": "Qual a porta do NTP?", "opts": ["UDP 123", "UDP 161", "TCP 123", "UDP 514"], "ans": 0, "exp": "NTP usa UDP 123."}, {"t": "mc", "q": "Em uma ACL, qual regra vale quando várias casam com o pacote?", "opts": ["A mais específica", "A primeira que casa, na ordem", "A última", "Todas"], "ans": 1, "exp": "A avaliação é sequencial; a primeira que casa decide."}, {"t": "mc", "q": "O que o SNMPv3 acrescenta em relação ao v2c?", "opts": ["Nada", "Autenticação e criptografia", "Mais velocidade", "Só traps"], "ans": 1, "exp": "O v2c usa comunidade em texto claro."}, {"t": "mc", "q": "Qual a diferença entre gerência em banda e fora de banda?", "opts": ["Em banda usa a rede de produção; fora de banda usa uma rede dedicada", "São iguais", "Fora de banda usa só serial", "Em banda não usa IP"], "ans": 0, "exp": "Fora de banda continua acessível quando o backbone falha."}, {"t": "d", "q": "Por que usar a Loopback como origem de serviços de gerência (SNMP, NTP, syslog)?", "ans": "Porque ela não cai com um cabo. O servidor sempre vê o mesmo endereço, e o equipamento continua alcançável por qualquer caminho.", "exp": ""}, {"t": "d", "q": "Cenário: após aplicar uma ACL de acesso remoto, você perdeu o acesso ao equipamento. O que provavelmente aconteceu?", "ans": "A ACL bloqueou a própria origem da gerência (regra errada, ordem das regras ou negação final sem permitir o seu IP). Por isso é essencial ter acesso de console antes de aplicar.", "exp": ""}, {"t": "d", "q": "Explique o princípio do menor privilégio na gerência de rede.", "ans": "Cada usuário recebe apenas o nível de acesso necessário para sua função, limitando o dano de erro ou invasão.", "exp": ""}]}, {"slug": "08-troubleshooting-cenarios", "titulo": "Cenários de troubleshooting", "intro": "Método sugerido: da camada física para cima. Leia o sintoma, formule hipóteses, teste a mais barata primeiro e mude uma coisa por vez.", "qs": [{"t": "d", "q": "Cenário 1: no agregado de dois cabos, uma porta aparece como não selecionada. Quais as causas prováveis?", "ans": "Modo LACP diferente nas pontas, velocidade ou duplex divergentes, porta desligada ou lado oposto não configurado.", "exp": "Comece comparando o estado de cada porta membro dos dois lados."}, {"t": "d", "q": "Cenário 2: o vizinho OSPF fica preso no estado Init. O que isso indica?", "ans": "Os hellos do vizinho chegam, mas o vizinho não vê os seus: problema de comunicação em um sentido (filtro, ACL, falha de enlace parcial).", "exp": "Em Init, o equipamento recebeu hello do vizinho, mas seu próprio ID não aparece na lista do vizinho."}, {"t": "d", "q": "Cenário 3: ping pequeno funciona, ping grande falha. Hipótese e como confirmar?", "ans": "MTU. Teste com tamanhos crescentes e sem fragmentação para achar o limite.", "exp": "Típico em MPLS, PPPoE e pseudowire, por causa do overhead."}, {"t": "d", "q": "Cenário 4: um túnel TE não sobe. Liste quatro itens para conferir.", "ans": "TE e RSVP ativos nas interfaces de todos os saltos, informação de TE no IGP, saltos do explicit-path corretos, banda disponível e configuração do túnel confirmada.", "exp": ""}, {"t": "d", "q": "Cenário 5: o pseudowire está caído, mas o LDP entre vizinhos diretos está bem. Onde olhar?", "ans": "A sessão LDP remota entre os PEs, a alcançabilidade da Loopback do peer, o identificador do circuito e a MTU.", "exp": ""}, {"t": "d", "q": "Cenário 6: após ligar um segundo cabo entre dois switches, a rede toda ficou lenta. Causa?", "ans": "Loop de L2 (círculo físico) sem STP ou sem agregação, causando tempestade de broadcast.", "exp": "Solução: agregar os cabos (Eth-Trunk) ou habilitar o STP."}, {"t": "d", "q": "Cenário 7: a Vlanif está ativa, mas o ping para o vizinho falha. O que investigar?", "ans": "VLAN não liberada no trunk, VLAN/tag diferente entre as pontas, porta bloqueada pelo STP ou IP/máscara incorretos.", "exp": ""}, {"t": "d", "q": "Cenário 8: sessão MP-BGP de VPN estabelecida, mas as rotas do outro site não aparecem. Causas?", "ans": "RT de exportação e importação não casam, família VPN não ativada no peer, rotas do cliente não redistribuídas no BGP da VRF.", "exp": ""}, {"t": "d", "q": "Cenário 9: os logs de dois equipamentos mostram horários diferentes e dificultam a investigação. Qual a causa e a correção?", "ans": "Falta de sincronização NTP ou fuso incorreto. Configurar NTP com a Loopback como origem e conferir o fuso.", "exp": ""}, {"t": "d", "q": "Cenário 10: um link caiu e o tráfego demorou cerca de 40 segundos para se recuperar. Por quê?", "ans": "Sem BFD, o OSPF depende do dead interval (40 s no padrão). Com BFD, a detecção cai para centenas de milissegundos.", "exp": ""}]}];
var app=document.getElementById('app');
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var opts={shuffleOpts:true,shuffleQs:false};

function home(){
  app.innerHTML='';
  var res=lsGet('bl_quiz');
  app.append(h('h1',null,'Quiz interativo'),
    h('p',{class:'muted'},'Escolha um tema. As objetivas corrigem na hora; nas discursivas você escreve, compara com o gabarito e se autoavalia. O resultado fica salvo neste navegador.'));
  var o1=h('input',{type:'checkbox',id:'o1'});o1.checked=opts.shuffleOpts;o1.onchange=function(){opts.shuffleOpts=o1.checked};
  var o2=h('input',{type:'checkbox',id:'o2'});o2.checked=opts.shuffleQs;o2.onchange=function(){opts.shuffleQs=o2.checked};
  app.append(h('div',{class:'row'},h('label',{class:'chk'},o1,'Embaralhar alternativas'),h('label',{class:'chk'},o2,'Embaralhar questões')));
  var grid=h('div',{class:'grid'});
  DATA.forEach(function(t){
    var r=res[t.slug];
    var nmc=t.qs.filter(function(q){return q.t==='mc'}).length;
    grid.append(h('div',{class:'card'},
      h('h3',null,t.titulo),
      h('div',{class:'muted'},t.qs.length+' questões ('+nmc+' objetivas)'),
      r?h('div',null,h('div',{class:'bar'},h('i',{style:'width:'+r.pct+'%'})),h('span',{class:'muted'},'Último resultado: '+r.pct+'% ('+r.correct+'/'+r.total+')')):h('div',{class:'muted'},'Ainda não feito'),
      h('div',{class:'row'},h('button',{class:'btn primary',type:'button',onclick:function(){start(t.qs,t.titulo,t.slug)}},'Começar'),
        h('button',{class:'btn',type:'button',onclick:function(){start(t.qs.filter(function(q){return q.t==='mc'}),t.titulo+' (objetivas)',null)}},'Só objetivas'))));
  });
  var all=[];DATA.forEach(function(t){t.qs.forEach(function(q){all.push(q)})});
  grid.append(h('div',{class:'card'},h('h3',null,'Simulado geral'),h('div',{class:'muted'},'20 questões sorteadas de todos os temas'),
    h('div',{class:'row'},h('button',{class:'btn primary',type:'button',onclick:function(){start(shuffle(all).slice(0,20),'Simulado geral','simulado')}},'Sortear e começar'))));
  app.append(grid);
}

var S=null;
function start(list,label,slug){
  list=opts.shuffleQs||slug==='simulado'?shuffle(list):list.slice();
  S={list:list,i:0,correct:0,wrong:[],label:label,slug:slug};
  question();
}
function question(){
  var q=S.list[S.i];app.innerHTML='';
  var pct=Math.round(S.i/S.list.length*100);
  app.append(h('div',{class:'muted'},S.label+'  |  Questão '+(S.i+1)+' de '+S.list.length+'  |  Acertos: '+S.correct),
    h('div',{class:'bar'},h('i',{style:'width:'+pct+'%'})),
    h('h2',null,q.q));
  if(q.t==='mc'){
    var order=q.opts.map(function(t,i){return {t:t,ok:i===q.ans}});
    if(opts.shuffleOpts)order=shuffle(order);
    var box=h('div');var done=false;
    order.forEach(function(o,idx){
      var b=h('button',{class:'opt',type:'button'},String.fromCharCode(65+idx)+') '+o.t);
      b.onclick=function(){
        if(done)return;done=true;
        Array.prototype.forEach.call(box.querySelectorAll('button'),function(x,j){x.disabled=true;if(order[j].ok)x.classList.add('ok')});
        if(o.ok){S.correct++;}else{b.classList.add('bad');S.wrong.push(q);}
        box.append(h('div',{class:'exp'},h('strong',null,o.ok?'Correto. ':'Incorreto. '),q.exp||''));
        box.append(h('div',{class:'row'},nextBtn()));
      };
      box.append(b);
    });
    app.append(box);
  }else{
    var ta=h('textarea',{placeholder:'Escreva sua resposta aqui antes de ver o gabarito...'});
    var res=h('div');
    var show=h('button',{class:'btn primary',type:'button'},'Mostrar resposta');
    show.onclick=function(){
      show.disabled=true;
      res.append(h('div',{class:'exp'},h('strong',null,'Resposta esperada: '),q.ans,q.exp?h('div',{class:'muted'},q.exp):null),
        h('div',{class:'row'},h('span',null,'Como foi a sua resposta?'),
          h('button',{class:'btn',type:'button',onclick:function(){S.correct++;next()}},'Acertei'),
          h('button',{class:'btn',type:'button',onclick:function(){S.wrong.push(q);next()}},'Errei ou faltou algo')));
    };
    app.append(ta,h('div',{class:'row'},show),res);
  }
}
function nextBtn(){return h('button',{class:'btn primary',type:'button',onclick:next},S.i+1<S.list.length?'Próxima':'Ver resultado');}
function next(){S.i++;if(S.i<S.list.length)question();else finish();}
function finish(){
  var total=S.list.length,pct=Math.round(S.correct/total*100);
  if(S.slug){var r=lsGet('bl_quiz');r[S.slug]={pct:pct,correct:S.correct,total:total,date:new Date().toISOString().slice(0,10)};lsSet('bl_quiz',r);}
  app.innerHTML='';
  app.append(h('h1',null,'Resultado: '+S.label),h('div',{class:'big'},pct+'%'),h('p',null,S.correct+' de '+total+' acertos.'),
    h('div',{class:'bar'},h('i',{style:'width:'+pct+'%'})),
    pct>=80?h('p',null,'Bom desempenho. Refaça em alguns dias para fixar.'):h('p',null,'Revise o guia do tema e refaça os erros.'));
  if(S.wrong.length){
    app.append(h('h3',null,'Para revisar'));
    var ul=h('ul');S.wrong.forEach(function(q){ul.append(h('li',null,q.q))});app.append(ul);
  }
  var row=h('div',{class:'row'});
  if(S.wrong.length)row.append(h('button',{class:'btn primary',type:'button',onclick:function(){start(S.wrong,S.label+' (revisão)',null)}},'Refazer só os erros'));
  row.append(h('button',{class:'btn',type:'button',onclick:home},'Voltar aos temas'));
  app.append(row);
}
home();
</script>
