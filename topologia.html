<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topologia interativa</title>
<link rel="stylesheet" href="assets/app.css">
<style>
svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px}
.link{stroke:var(--muted);stroke-width:3;fill:none}
.link.thick{stroke-width:7}
.link.active{stroke:var(--accent);stroke-width:6}
.link.backup{stroke:var(--warn);stroke-dasharray:9 6;stroke-width:5}
.link.pw{stroke:var(--blue);stroke-width:6}
.link.down{stroke:var(--bad);stroke-dasharray:3 6;opacity:.6}
.link.hit{stroke:transparent;stroke-width:22;cursor:pointer}
.node rect{stroke-width:2;cursor:pointer}
.node.pe rect{fill:var(--card);stroke:var(--blue)}
.node.p rect{fill:var(--card);stroke:var(--accent)}
.node.cust rect{fill:var(--card);stroke:var(--warn)}
.node.down rect{stroke:var(--bad);fill:var(--badbg)}
.node.sel rect{stroke-width:4}
.node text{fill:var(--fg);pointer-events:none}
.nm{font-size:16px;font-weight:700}
.sb{font-size:12px;fill:var(--muted)!important}
.lbl{font-size:12px;fill:var(--fg);paint-order:stroke;stroke:var(--card);stroke-width:4px;pointer-events:none}
.note{font-size:12px;font-weight:700;fill:var(--accent);pointer-events:none}
.layers button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#panel{margin-top:14px}
#panel h3{margin:0 0 6px}
#status{margin:10px 0;padding:10px 12px;border-left:4px solid var(--accent);background:var(--card);border-radius:6px}
#status.bad{border-color:var(--bad)}
.legend span{display:inline-block;margin-right:14px;font-size:13px}
.legend i{display:inline-block;width:26px;height:0;border-top:4px solid;vertical-align:middle;margin-right:5px}
ul.i{margin:6px 0 0 18px;padding:0}
</style>
</head>
<body>
<header class="top"><a href="./">&larr; Voltar ao site</a><span class="title">Topologia interativa</span><button class="btn" id="themeBtn" type="button">Tema</button></header>
<main class="wrap">
<p class="muted">Clique em um equipamento ou em um link para ver detalhes. Troque a camada para ver o que cada uma faz e simule a queda de um roteador do core.</p>

<div class="row"><strong>Etapa:</strong>
  <span class="layers" id="stages"></span>
</div>
<div class="row"><strong>Camada:</strong>
  <span class="layers" id="layers"></span>
</div>
<div class="row"><strong>Falha:</strong>
  <button class="btn" type="button" id="fR2">Derrubar R2</button>
  <button class="btn" type="button" id="fR4">Derrubar R4</button>
  <button class="btn" type="button" id="fOk">Restaurar tudo</button>
</div>

<svg id="svg" viewBox="0 0 800 430" role="img" aria-label="Topologia do backbone"></svg>
<div class="legend" id="legend" style="margin-top:8px"></div>
<div id="status"></div>
<div id="layerinfo" class="card"></div>
<div id="panel" class="card"></div>
</main>

<script>
document.getElementById('themeBtn').onclick=function(){var c=document.documentElement.getAttribute('data-theme');var n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('bl_theme',n)}catch(e){}};
(function(){var t=null;try{t=localStorage.getItem('bl_theme')}catch(e){}
if(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';
document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();

var NS='http://www.w3.org/2000/svg';
var NODES={
 CE:{x:80,y:215,name:'CE12800',sub:'OLT / acesso',cls:'cust',stage:1,
  role:'Faz o papel de OLT: equipamento de acesso em L2. O IP dele existe só para gerência.',
  ifs:['Eth-Trunk 1 (GE1/0/0 + GE1/0/1) para o R1, trunk com a VLAN 100','Vlanif 100: 10.200.0.1/30','Gerência fora de banda (MEth0/0/0): 192.168.100.10/24'],
  labs:'Labs 1, 1.5, 1.6 e 7'},
 R1:{x:250,y:215,name:'R1',sub:'PE1',cls:'pe',stage:1,
  role:'Roteador de borda (PE). Recebe o acesso, coloca e retira labels e entrega o serviço.',
  ifs:['Eth-Trunk 1 (Eth1/0/0 + Eth1/0/1) para a OLT','Vlanif 100: 10.200.0.2/30','Eth1/0/2 para o R2: 10.200.0.5/30','Para o R4 (a partir do Lab 3): 10.200.0.13/30','Loopback0: 10.200.255.1/32','Gerência: 192.168.100.1/24'],
  labs:'Labs 1, 3, 5, 5.1, 6 e 6.1'},
 R2:{x:425,y:330,name:'R2',sub:'P (core)',cls:'p',stage:1,
  role:'Roteador de trânsito (P). Só comuta por label e não conhece os clientes.',
  ifs:['Eth1/0/0 para o R1: 10.200.0.6/30','Eth1/0/1 para o R3: 10.200.0.9/30','Loopback0: 10.200.255.2/32','Gerência: 192.168.100.2/24'],
  labs:'Labs 1, 3, 5 e 5.1'},
 R4:{x:425,y:100,name:'R4',sub:'P (backup)',cls:'p',stage:2,
  role:'Segundo roteador de trânsito. Forma o caminho alternativo entre R1 e R3.',
  ifs:['Para o R1: 10.200.0.14/30','Para o R3: 10.200.0.17/30','Loopback0: 10.200.255.4/32','Gerência: 192.168.100.4/24'],
  labs:'Labs 3, 5.1 e 5.2'},
 R3:{x:600,y:215,name:'R3',sub:'PE2',cls:'pe',stage:1,
  role:'Segundo roteador de borda (PE). Faz o papel espelhado do R1 na outra ponta.',
  ifs:['Eth1/0/0 para o R2: 10.200.0.10/30','Para o R4: 10.200.0.18/30','Para o R5 (futuro): 10.200.0.21/30','Loopback0: 10.200.255.3/32','Gerência: 192.168.100.3/24'],
  labs:'Labs 1, 3, 5, 5.1, 6 e 6.1'},
 R5:{x:735,y:215,name:'R5',sub:'CE2 (site B)',cls:'cust',stage:3,
  role:'Segundo cliente (site B). No Lab 6.1 vira a outra ponta da VPN do cliente.',
  ifs:['Para o R3: 10.200.0.22/30','Loopback0: 10.200.255.5/32'],
  labs:'Labs 6 e 6.1'}
};
var LINKS=[
 {id:'CE-R1',a:'CE',b:'R1',stage:1,net:'10.200.0.0/30',ips:'CE12800 .1 e R1 .2',kind:'Eth-Trunk de 2 cabos, trunk com a VLAN 100 (Vlanif nas duas pontas)',phys:'Eth-Trunk (2 cabos)'},
 {id:'R1-R2',a:'R1',b:'R2',stage:1,net:'10.200.0.4/30',ips:'R1 .5 e R2 .6',kind:'Link L3 roteado, ponto a ponto',phys:'L3 /30'},
 {id:'R2-R3',a:'R2',b:'R3',stage:1,net:'10.200.0.8/30',ips:'R2 .9 e R3 .10',kind:'Link L3 roteado, ponto a ponto',phys:'L3 /30'},
 {id:'R1-R4',a:'R1',b:'R4',stage:2,net:'10.200.0.12/30',ips:'R1 .13 e R4 .14',kind:'Link L3 roteado do caminho alternativo',phys:'L3 /30'},
 {id:'R4-R3',a:'R4',b:'R3',stage:2,net:'10.200.0.16/30',ips:'R4 .17 e R3 .18',kind:'Link L3 roteado do caminho alternativo',phys:'L3 /30'},
 {id:'R3-R5',a:'R3',b:'R5',stage:3,net:'10.200.0.20/30',ips:'R3 .21 e R5 .22',kind:'Link PE-CE. No Lab 6.1 passa a pertencer à VRF do cliente.',phys:'PE-CE'}
];
var STAGES=[{n:1,t:'Lab 1 (base)'},{n:2,t:'Com R4 (Labs 3 a 5)'},{n:3,t:'Completa (com R5)'}];
var LAYERS=[
 {id:'fisica',t:'Física e L2',d:'Camada 1 e 2: cabos, agregação e VLAN. O link da OLT é um Eth-Trunk de dois cabos (LACP) em trunk com a VLAN 100. Os demais são cabos simples. Aqui não existe roteamento ainda.'},
 {id:'l3',t:'IP e OSPF',d:'Camada 3: cada link é um /30 próprio e cada roteador tem uma Loopback /32. O OSPF (área 0) anuncia links e Loopbacks e calcula o menor caminho. É o que permite os PEs se enxergarem.'},
 {id:'mpls',t:'MPLS e LDP',d:'O PE de entrada (R1) coloca uma label, o P troca ou retira, e o PE de saída (R3) entrega o pacote IP. O LDP distribui as labels seguindo o caminho que o OSPF escolheu.'},
 {id:'te',t:'MPLS-TE',d:'Túnel com caminho escolhido: principal pelo R2 e secundário pelo R4 (hot-standby). Se o principal cair, o tráfego migra para o backup. Teste derrubando o R2.'},
 {id:'servico',t:'Serviço (L2VPN)',d:'Um pseudowire/VSI leva a VLAN do cliente do R1 ao R3 sobre o túnel. Para o cliente é como um cabo entre os dois sites; o núcleo não vê o conteúdo.'}
];
var st={stage:3,layer:'fisica',down:{R2:false,R4:false},sel:null};

function el(n,a,txt){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}
function nodeOn(id){var n=NODES[id];return n.stage<=st.stage;}
function linkOn(l){return l.stage<=st.stage;}
function isDown(id){return !!st.down[id];}

function activePath(){
  if(!isDown('R2'))return ['R1-R2','R2-R3'];
  if(st.stage>=2&&!isDown('R4'))return ['R1-R4','R4-R3'];
  return null;
}
function pathNodes(p){if(!p)return null;return p[0]==='R1-R2'?'R1 > R2 > R3':'R1 > R4 > R3';}
function lk(id){return LINKS.filter(function(l){return l.id===id})[0];}
function mid(l){var a=NODES[l.a],b=NODES[l.b];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}

function draw(){
  var svg=document.getElementById('svg');svg.innerHTML='';
  var ap=activePath();
  var lines=el('g',{}),labels=el('g',{}),nodes=el('g',{});
  LINKS.forEach(function(l){
    if(!linkOn(l))return;
    var a=NODES[l.a],b=NODES[l.b];
    var dead=isDown(l.a)||isDown(l.b);
    var cls='link';
    if(l.id==='CE-R1'&&st.layer==='fisica')cls+=' thick';
    var inAp=ap&&ap.indexOf(l.id)>=0;
    var isPrim=(l.id==='R1-R2'||l.id==='R2-R3'),isBack=(l.id==='R1-R4'||l.id==='R4-R3');
    if(st.layer==='mpls'&&inAp)cls+=' active';
    if(st.layer==='te'){ if(inAp)cls+=' active'; else if(isBack&&!inAp&&!dead)cls+=' backup'; }
    if(st.layer==='servico'&&inAp)cls+=' pw';
    if(dead)cls+=' down';
    var ln=el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,'class':cls});
    lines.append(ln);
    var hit=el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,'class':'link hit'});
    hit.addEventListener('click',function(){st.sel={t:'l',id:l.id};render();});
    lines.append(hit);
    var m=mid(l),txt='';
    if(st.layer==='fisica')txt=l.phys;
    else if(st.layer==='l3')txt=l.net;
    else if(st.layer==='mpls')txt=dead?'':'LDP';
    else if(st.layer==='te')txt=inAp?'túnel ativo':(isBack&&!dead?'backup':'');
    else if(st.layer==='servico')txt=inAp?'pseudowire':'';
    if(txt){var oy=(l.id==='R1-R4'||l.id==='R4-R3')?-8:(l.id==='R1-R2'||l.id==='R2-R3')?16:-12;
      labels.append(el('text',{x:m.x,y:m.y+oy,'text-anchor':'middle','class':'lbl'},txt));}
  });
  Object.keys(NODES).forEach(function(id){
    if(!nodeOn(id))return;
    var n=NODES[id];
    var g=el('g',{'class':'node '+n.cls+(isDown(id)?' down':'')+(st.sel&&st.sel.t==='n'&&st.sel.id===id?' sel':''),tabindex:'0',role:'button','aria-label':n.name});
    g.append(el('rect',{x:n.x-52,y:n.y-26,width:104,height:52,rx:10}));
    g.append(el('text',{x:n.x,y:n.y-3,'text-anchor':'middle','class':'nm'},n.name));
    g.append(el('text',{x:n.x,y:n.y+15,'text-anchor':'middle','class':'sb'},isDown(id)?'CAÍDO':n.sub));
    g.addEventListener('click',function(){st.sel={t:'n',id:id};render();});
    g.addEventListener('keydown',function(e){if(e.key==='Enter'){st.sel={t:'n',id:id};render();}});
    nodes.append(g);
    var note='';
    if(!isDown(id)){
      if(st.layer==='l3'&&id.charAt(0)==='R')note='lo 10.200.255.'+id.charAt(1);
      if(st.layer==='mpls'&&ap){
        var via=ap[0]==='R1-R2'?'R2':'R4';
        if(id==='R1')note='push label';
        else if(id===via)note='swap/pop (PHP)';
        else if(id==='R3')note='entrega IP';
      }
      if(st.layer==='te'&&id==='R1')note='origem do túnel';
      if(st.layer==='te'&&id==='R3')note='destino (Loopback)';
      if(st.layer==='servico'&&(id==='R1'||id==='R3'))note='VSI / vsi-id 3051';
      if(st.layer==='servico'&&(id==='CE'||id==='R5'))note='cliente';
      if(st.layer==='fisica'&&id==='CE')note='VLAN 100 (trunk)';
    }
    if(note)nodes.append(el('text',{x:n.x,y:n.y+44,'text-anchor':'middle','class':'note'},note));
  });
  svg.append(lines,labels,nodes);
}

function legend(){
  var L=document.getElementById('legend');L.innerHTML='';
  function item(c,t,dash){var s=document.createElement('span');var i=document.createElement('i');i.style.borderTopColor=c;if(dash)i.style.borderTopStyle='dashed';s.append(i,document.createTextNode(t));L.append(s);}
  var l=st.layer;
  if(l==='mpls'){item('var(--accent)','caminho de labels (LSP)');}
  if(l==='te'){item('var(--accent)','túnel ativo');item('var(--warn)','backup (hot-standby)',true);}
  if(l==='servico'){item('var(--blue)','pseudowire sobre o túnel');}
  item('var(--bad)','equipamento ou link caído',true);
}

function statusBox(){
  var s=document.getElementById('status'),ap=activePath();
  var down=Object.keys(st.down).filter(function(k){return st.down[k]});
  s.className='';
  var msg;
  if(!ap){s.className='bad';msg='Sem caminho entre R1 e R3.'+(st.stage<2?' Nesta etapa não existe o R4, então a queda do R2 isola o R3. É o motivo de adicionar redundância.':' R2 e R4 estão caídos.');}
  else if(down.length===0){msg='Tudo operando. Caminho ativo: '+pathNodes(ap)+'.';}
  else{msg='Falha em '+down.join(' e ')+'. O tráfego seguiu pelo caminho: '+pathNodes(ap)+'.';
    if(st.layer==='l3')msg+=' O OSPF recalculou e escolheu o caminho que restou (com BFD isso leva centenas de milissegundos).';
    if(st.layer==='te')msg+=' O túnel migrou para o backup. Sem hot-standby o desvio seria mais lento.';
    if(st.layer==='servico')msg+=' O pseudowire continua, porque ele segue o túnel.';
  }
  s.textContent=msg;
}

function panel(){
  var p=document.getElementById('panel');p.innerHTML='';
  if(!st.sel){var q=document.createElement('p');q.className='muted';q.textContent='Clique em um equipamento ou link para ver os detalhes.';p.append(q);return;}
  function h3(t){var e=document.createElement('h3');e.textContent=t;p.append(e);}
  function para(t,c){var e=document.createElement('p');e.textContent=t;if(c)e.className=c;p.append(e);}
  function list(a){var u=document.createElement('ul');u.className='i';a.forEach(function(x){var li=document.createElement('li');li.textContent=x;u.append(li);});p.append(u);}
  if(st.sel.t==='n'){var n=NODES[st.sel.id];h3(n.name+' ('+n.sub+')');para(n.role);para('Interfaces e endereços:','muted');list(n.ifs);para('Onde é configurado: '+n.labs,'muted');}
  else{var l=lk(st.sel.id);h3('Link '+NODES[l.a].name+' - '+NODES[l.b].name);para('Rede: '+l.net+' ('+l.ips+')');para(l.kind);}
}

function layerInfo(){
  var d=document.getElementById('layerinfo');d.innerHTML='';
  var L=LAYERS.filter(function(x){return x.id===st.layer})[0];
  var h=document.createElement('h3');h.textContent='O que acontece nesta camada: '+L.t;
  var p=document.createElement('p');p.textContent=L.d;d.append(h,p);
}

function buttons(){
  var s=document.getElementById('stages');s.innerHTML='';
  STAGES.forEach(function(x){var b=document.createElement('button');b.type='button';b.className='btn'+(st.stage===x.n?' on':'');b.textContent=x.t;b.style.marginRight='6px';
    b.onclick=function(){st.stage=x.n;if(st.stage<2)st.down.R4=false;if(st.sel&&((st.sel.t==='n'&&!nodeOn(st.sel.id))||(st.sel.t==='l'&&!linkOn(lk(st.sel.id)))))st.sel=null;render();};s.append(b);});
  var l=document.getElementById('layers');l.innerHTML='';
  LAYERS.forEach(function(x){var b=document.createElement('button');b.type='button';b.className='btn'+(st.layer===x.id?' on':'');b.textContent=x.t;b.style.marginRight='6px';
    b.onclick=function(){st.layer=x.id;render();};l.append(b);});
  document.getElementById('stages').className='layers';document.getElementById('layers').className='layers';
  document.getElementById('fR4').disabled=st.stage<2;
}
document.getElementById('fR2').onclick=function(){st.down.R2=!st.down.R2;document.getElementById('fR2').textContent=st.down.R2?'Religar R2':'Derrubar R2';render();};
document.getElementById('fR4').onclick=function(){st.down.R4=!st.down.R4;document.getElementById('fR4').textContent=st.down.R4?'Religar R4':'Derrubar R4';render();};
document.getElementById('fOk').onclick=function(){st.down.R2=false;st.down.R4=false;document.getElementById('fR2').textContent='Derrubar R2';document.getElementById('fR4').textContent='Derrubar R4';render();};

function render(){buttons();draw();legend();statusBox();layerInfo();panel();}
render();
</script>
</body>
</html>
